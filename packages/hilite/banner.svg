<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Hilite: VS Code highlighting, no WebAssembly.">
  <defs>
    <clipPath id="tile"><rect width="160" height="160" rx="38"/></clipPath>
  </defs>
  <rect width="1280" height="320" fill="#0e1218"/>

  <g transform="translate(96 62)">
    <rect width="160" height="160" rx="38" fill="#0e1218" stroke="#273041" stroke-width="2"/>
    <g clip-path="url(#tile)">
      <circle cx="80" cy="137.5" r="74" fill="#f5683d"/>
      <circle cx="66" cy="149" r="74" fill="#e8ecf1"/>
    </g>
  </g>

  <text x="332" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5" fill="#cfd6e0">Syntax highlighting</text>
  <text x="328" y="196" font-family="'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#f5683d">Hilite</text>
  <text x="332" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#9aa6b8">VS Code grammars and themes, in a 4.7 KB tokenizer. No WebAssembly.</text>

  <rect x="24" y="290" width="1232" height="8" fill="#f5683d"/>
</svg>
